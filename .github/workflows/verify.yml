name: Verify CrAnE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Verify the final geometry and every PNG pixel
        run: npm run check
      - name: Rebuild the final assets
        run: npm run build
      - name: Ensure the checked-in assets are reproducible
        run: git diff --exit-code -- assets/CrAnE.svg assets/CrAnE.png
